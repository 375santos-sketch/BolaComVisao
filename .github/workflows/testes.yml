name: Testes

# Em cada Pull Request e em cada alteração à main: verificação completa, testes de integração (regras e
# sincronização) e testes de ecrã, contra os emuladores do Firebase. Nunca toca na base de dados real.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, lint, formatação, testes unitários e build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      # Not --frozen-lockfile: the AI Studio sometimes rewrites bun.lock out of step with package.json, and the
      # tests must still run (package.json is the source of truth).
      - name: Instalar dependências
        run: bun install

      - name: Verificar
        run: npm run verify

  ecras:
    name: Testes de ecrã e de integração (emuladores)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2

      # Not --frozen-lockfile: the AI Studio sometimes rewrites bun.lock out of step with package.json, and the
      # tests must still run (package.json is the source of truth).
      - name: Instalar dependências
        run: bun install

      # The browser itself comes from Playwright's servers. Its system libraries come from Ubuntu's mirrors (apt),
      # which have been failing ("Installation process exited with code: 100") and used to stop the whole job before
      # any test ran. GitHub's Ubuntu image already has almost all of them: try apt a few times and carry on if the
      # mirrors stay down; the tests themselves show whether the browser starts.
      - name: Instalar o navegador dos testes
        run: npx playwright install chromium

      - name: Bibliotecas do navegador (se os servidores do Ubuntu responderem)
        run: |
          for i in 1 2 3; do
            if sudo npx playwright install-deps chromium; then exit 0; fi
            echo "::warning::apt não respondeu (tentativa $i de 3)"
            sleep 30
          done
          echo "::warning::Sem as bibliotecas do apt: os testes seguem com as que a imagem do GitHub já tem."

      - name: Testes de integração (regras e sincronização)
        run: npm run test:emulator

      - name: Testes de ecrã
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Relatório dos testes de ecrã
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-de-ecra
          path: |
            playwright-report/
            test-results/
          retention-days: 14
