name: Regras do Firestore

# Testa as regras em cada Pull Request que as altere e, depois do merge, publica-as na base de dados da app
# (a base com nome definida em firebase.json, não a "(default)").

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'src/__emulator__/**'
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Testar regras (emuladores)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2

      # Not --frozen-lockfile: the AI Studio sometimes rewrites bun.lock out of step with package.json, and the
      # tests must still run (package.json is the source of truth).
      - name: Instalar dependências
        run: bun install

      - name: Testes de regras e sincronização
        run: npm run test:emulator

  deploy:
    name: Publicar regras no Firebase
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Secrets can't be read in step conditions: expose only whether each one exists.
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      HAS_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar credenciais
        run: |
          if [ "$HAS_SERVICE_ACCOUNT" != "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Falta o secret FIREBASE_TOKEN (ou FIREBASE_SERVICE_ACCOUNT). Ver README, secção das regras do Firestore."
            exit 1
          fi

      # Conta de serviço, se o projeto permitir criar chaves (os projetos do AI Studio não permitem).
      - uses: google-github-actions/auth@v2
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar firestore.rules (conta de serviço)
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        run: npx -y firebase-tools@13.35.1 deploy --only firestore:rules --project glowing-orbit-vk8sk --non-interactive

      # Sem conta de serviço, usa o código de acesso de "firebase login:ci" (FIREBASE_TOKEN).
      - name: Publicar firestore.rules (código de acesso)
        if: env.HAS_SERVICE_ACCOUNT != 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx -y firebase-tools@13.35.1 deploy --only firestore:rules --project glowing-orbit-vk8sk --non-interactive 2>&1 | tee deploy.log
          exit ${PIPESTATUS[0]}

      # The deploy can report success without the app's database using the new rules (wrong database, rules replaced
      # elsewhere). Check it from outside: anyone may read a parents' calendar by its token, so reading a token that
      # does not exist must answer "not found" (404), never "permission denied" (403).
      - name: Confirmar que as regras estão ativas na base de dados da app
        if: always()
        run: |
          grep -v "npm warn" deploy.log | sed 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | tail -25 | while IFS= read -r line; do
            echo "::notice title=Firebase deploy::$line"
          done || true
          DB=$(node -p "require('./firebase.json').firestore[0].database")
          KEY=$(node -p "require('./firebase-applet-config.json').apiKey")
          URL="https://firestore.googleapis.com/v1/projects/glowing-orbit-vk8sk/databases/${DB}/documents/public_calendars/VerificacaoRegrasInexistente1"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "${URL}?key=${KEY}")
            [ "$CODE" = "404" ] && break
            sleep 20
          done
          echo "::notice title=Verificação das regras::Base ${DB}: leitura pública de teste respondeu ${CODE} (esperado 404)"
          if [ "$CODE" != "404" ]; then
            echo "::error title=Regras não ativas::A base de dados ${DB} não está a usar as regras novas (resposta ${CODE})."
            exit 1
          fi
