name: Regras do Firestore

# Testa as regras em cada Pull Request que as altere e, depois do merge, publica-as na base de dados da app
# (a base com nome definida em firebase.json, não a "(default)").

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'src/__emulator__/**'
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'
  workflow_dispatch:

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Testar regras (emuladores)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Testes de regras e sincronização
        run: npm run test:emulator

  deploy:
    name: Publicar regras no Firebase
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Secrets can't be read in step conditions: expose only whether each one exists.
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      HAS_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar credenciais
        run: |
          if [ "$HAS_SERVICE_ACCOUNT" != "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Falta o secret FIREBASE_TOKEN (ou FIREBASE_SERVICE_ACCOUNT). Ver README, secção das regras do Firestore."
            exit 1
          fi

      # Conta de serviço, se o projeto permitir criar chaves (os projetos do AI Studio não permitem).
      - uses: google-github-actions/auth@v2
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar firestore.rules (conta de serviço)
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        run: npx -y firebase-tools@13.35.1 deploy --only firestore:rules --project glowing-orbit-vk8sk --non-interactive

      # Sem conta de serviço, usa o código de acesso de "firebase login:ci" (FIREBASE_TOKEN).
      - name: Publicar firestore.rules (código de acesso)
        if: env.HAS_SERVICE_ACCOUNT != 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@13.35.1 deploy --only firestore:rules --project glowing-orbit-vk8sk --non-interactive
