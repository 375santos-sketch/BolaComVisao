<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Jogador do jogo · Votação</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: linear-gradient(180deg, #0a192a, #0f2f4d);
        color: #e2e8f0;
        display: flex;
        justify-content: center;
        padding: 24px 16px;
      }
      main {
        width: 100%;
        max-width: 420px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        color: #facc15;
        text-align: center;
      }
      .sub {
        text-align: center;
        color: #8fc7e6;
        font-size: 14px;
        margin: 0 0 20px;
      }
      .list {
        display: grid;
        gap: 8px;
      }
      .opt {
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        border: 2px solid #1e3a55;
        background: #0d2338;
        color: #f8fafc;
        font-size: 17px;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      .opt[aria-pressed='true'] {
        border-color: #facc15;
        background: #2a2a10;
      }
      .vote {
        margin-top: 16px;
        width: 100%;
        padding: 15px;
        border: 0;
        border-radius: 14px;
        background: #facc15;
        color: #0a192a;
        font-size: 17px;
        font-weight: 800;
        cursor: pointer;
      }
      .vote:disabled {
        opacity: 0.4;
      }
      .msg {
        text-align: center;
        padding: 28px 12px;
        border-radius: 16px;
        background: #0d2338;
        font-size: 17px;
        line-height: 1.5;
      }
      .note {
        margin-top: 18px;
        text-align: center;
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main id="app"><p class="msg">A carregar…</p></main>
    <script type="module" src="/src/vote/main.ts"></script>
  </body>
</html>
